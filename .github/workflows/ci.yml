name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint backend
        run: python -m ruff check apps/api services
      - name: Test backend
        run: python -m pytest
      - name: Compile PostgreSQL migration SQL
        run: alembic upgrade head --sql > migration.sql

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend workspaces
        run: npm test
      - name: Lint frontend workspaces
        run: npm run lint
      - name: Typecheck frontend workspaces
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
